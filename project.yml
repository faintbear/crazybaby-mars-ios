name: MarsControl
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  MarsControl:
    type: application
    platform: iOS
    sources: [MarsControl]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MARS_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: MarsControl/Info.plist
      properties:
        CFBundleDisplayName: Mars 控制
        CFBundleShortVersionString: "0.5.0"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSBluetoothAlwaysUsageDescription: 通过蓝牙连接并控制你的 Mars 音箱。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
schemes:
  MarsControl:
    build:
      targets:
        MarsControl: all
